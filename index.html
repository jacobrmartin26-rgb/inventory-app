<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Household Goods Descriptive Inventory</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --border: #c0c0c0;
    --border-light: #e0e0e0;
    --text: #111;
    --text-sec: #555;
    --text-hi: #000;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --surface: #1a1a1a;
      --border: #444;
      --border-light: #333;
      --text: #eee;
      --text-sec: #999;
      --text-hi: #fff;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.4;
    padding: 8px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 2px solid var(--text-hi);
    margin-bottom: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
    padding-top: 2px;
  }
  .tab-btn {
    padding: 8px 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-sec);
    font-weight: 600;
    font-size: 13px;
    border-bottom: 3px solid transparent;
    font-family: inherit;
    white-space: nowrap;
  }
  .tab-btn.active { color: var(--text-hi); border-bottom-color: var(--text-hi); }
  .panel { display: none; padding-bottom: 40px; }
  .panel.active { display: block; }

  /* Paper form header */
  .sheet {
    border: 2px solid var(--text-hi);
    background: var(--bg);
    margin-bottom: 12px;
  }
  .sheet-top {
    display: grid;
    grid-template-columns: 1fr auto auto;
    border-bottom: 2px solid var(--text-hi);
  }
  .sheet-top > div {
    padding: 6px 10px;
    border-right: 1px solid var(--border);
  }
  .sheet-top > div:last-child { border-right: none; }
  .sheet-mid {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    border-bottom: 1px solid var(--border);
  }
  .sheet-mid > div {
    padding: 6px 10px;
    border-right: 1px solid var(--border);
  }
  .sheet-mid > div:last-child { border-right: none; }
  .lbl {
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-sec);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .sheet input, .setup-grid input, .setup-grid textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    padding: 2px 0;
  }
  .sheet input:focus, .setup-grid input:focus { outline: none; }

  .setup-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    margin-bottom: 12px;
  }
  .setup-grid .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .setup-grid label {
    font-size: 11px;
    color: var(--text-sec);
    font-weight: 600;
    text-transform: uppercase;
  }
  .setup-grid input {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    font-size: 14px;
  }

  /* Inventory table */
  .inv-table {
    width: 100%;
    border-collapse: collapse;
  }
  .inv-table th {
    border-bottom: 2px solid var(--text-hi);
    border-right: 1px solid var(--border);
    padding: 5px 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    background: var(--surface);
    line-height: 1.2;
  }
  .inv-table th:last-child { border-right: none; }
  .inv-table td {
    border-bottom: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
    padding: 2px 3px;
    height: 32px;
    vertical-align: middle;
  }
  .inv-table td:last-child { border-right: none; }
  .inv-table input[type="text"],
  .inv-table textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    padding: 2px 4px;
    resize: none;
    line-height: 1.3;
  }
  .inv-table input:focus, .inv-table textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: rgba(37,99,235,0.04);
  }
  .inv-table input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--text-hi);
    cursor: pointer;
    display: block;
    margin: 0 auto;
  }
  .row-num {
    text-align: center;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-sec);
    user-select: none;
    cursor: pointer;
    position: relative;
    width: 36px;
  }
  .row-num.source {
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    font-weight: 700;
  }
  .row-num.source::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
  }
  .row-num.target {
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }

  .photo-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex-wrap: wrap;
    min-width: 44px;
  }
  .thumb {
    width: 22px;
    height: 22px;
    object-fit: cover;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .cam-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 2px;
    background: none;
    cursor: pointer;
    color: var(--text-sec);
    padding: 0;
  }

  /* Bottom area */
  .bottom-block {
    border-top: 2px solid var(--text-hi);
    padding: 10px;
  }
  .sig-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .sig-box {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    background: var(--bg);
  }
  .sig-box .lbl { margin-bottom: 4px; }
  .sig-canvas {
    width: 100%;
    height: 80px;
    display: block;
    cursor: crosshair;
    touch-action: none;
    background: var(--bg);
  }
  .tape-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    font-size: 11px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  /* Tally page */
  .tally-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 0;
    border: 2px solid var(--text-hi);
    margin-bottom: 12px;
  }
  .tally-grid > div {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
    font-size: 13px;
  }
  .tally-grid .th {
    background: var(--surface);
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    border-bottom: 2px solid var(--text-hi);
  }
  .tally-grid > div:nth-child(3n) { border-right: none; }

  /* Condition table */
  .cond-table {
    width: 100%;
    border-collapse: collapse;
  }
  .cond-table th {
    border-bottom: 2px solid var(--text-hi);
    border-right: 1px solid var(--border);
    padding: 5px 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    background: var(--surface);
  }
  .cond-table th:last-child { border-right: none; }
  .cond-table td {
    border-bottom: 1px solid var(--border-light);
    border-right: 1px solid var(--border-light);
    padding: 2px 3px;
    height: 32px;
    vertical-align: middle;
  }
  .cond-table td:last-child { border-right: none; }
  .cond-table input, .cond-table textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    padding: 2px 4px;
    resize: none;
  }
  .cond-table input:focus, .cond-table textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: rgba(37,99,235,0.04);
  }

  /* Page tabs */
  .page-tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .page-tab {
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
  }
  .page-tab.active {
    background: var(--text-hi);
    color: var(--bg);
    border-color: var(--text-hi);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    touch-action: manipulation;
  }
  .btn-primary { background: var(--text-hi); color: var(--bg); border-color: var(--text-hi); }
  .btn-ghost { background: transparent; border: none; padding: 2px; color: var(--text-sec); }
  .btn-sm { padding: 4px 8px; font-size: 11px; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .overlay img { max-width: 100%; max-height: 100%; border-radius: 4px; object-fit: contain; }

  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--text-hi); color: var(--bg);
    padding: 8px 16px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    z-index: 50; opacity: 0;
    transition: opacity 150ms;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .flex { display: flex; }
  .between { justify-content: space-between; }
  .items-center { align-items: center; }
  .gap-1 { gap: 4px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .mt-2 { margin-top: 8px; }
  .mono { font-family: ui-monospace, monospace; }
  .small { font-size: 11px; color: var(--text-sec); }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" data-tab="setup" onclick="switchTab('setup')">Setup</button>
  <button class="tab-btn" data-tab="inventory" onclick="switchTab('inventory')">Inventory</button>
  <button class="tab-btn" data-tab="tally" onclick="switchTab('tally')">Tally</button>
  <button class="tab-btn" data-tab="premove" onclick="switchTab('premove')">Pre-move</button>
  <button class="tab-btn" data-tab="postmove" onclick="switchTab('postmove')">Post-move</button>
</div>

<!-- SETUP -->
<div id="panel-setup" class="panel active">
  <div class="setup-grid">
    <div class="field"><label>Shipper's Name</label><input id="s-name" oninput="updateSetup()"></div>
    <div class="field"><label>Carrier Ref No.</label><input id="s-ref" oninput="updateSetup()"></div>
    <div class="field"><label>Origin City, State</label><input id="s-origin" oninput="updateSetup()"></div>
    <div class="field"><label>Destination City, State</label><input id="s-dest" oninput="updateSetup()"></div>
    <div class="field"><label>Bill of Lading No</label><input id="s-bol" oninput="updateSetup()"></div>
    <div class="field"><label>Tape Lot No</label><input id="s-tape" oninput="updateSetup()"></div>
    <div class="field"><label>Tape Color</label><input id="s-tcolor" oninput="updateSetup()"></div>
    <div class="field"><label>Driver (Origin)</label><input id="s-dorig" oninput="updateSetup()"></div>
    <div class="field"><label>Date (Origin)</label><input type="date" id="s-dorig-date" oninput="updateSetup()"></div>
    <div class="field"><label>Driver (Dest)</label><input id="s-ddest" oninput="updateSetup()"></div>
    <div class="field"><label>Date (Dest)</label><input type="date" id="s-ddest-date" oninput="updateSetup()"></div>
  </div>
</div>

<!-- INVENTORY -->
<div id="panel-inventory" class="panel">
  <div class="flex between items-center mb-2">
    <div class="page-tabs" id="inv-tabs"></div>
    <button class="btn btn-sm" onclick="addPage()">+ Add page</button>
  </div>
  <div id="inv-content"></div>
</div>

<!-- TALLY -->
<div id="panel-tally" class="panel">
  <div id="tally-content"></div>
</div>

<!-- PRE-MOVE -->
<div id="panel-premove" class="panel">
  <div id="premove-content"></div>
</div>

<!-- POST-MOVE -->
<div id="panel-postmove" class="panel">
  <div id="postmove-content"></div>
</div>

<div id="overlay" class="overlay" onclick="this.style.display='none'"><img id="overlay-img" src="" alt=""></div>
<div id="toast" class="toast"></div>

<script>
const ROWS = 30;

let state = {
  setup: {},
  pages: [makePage(1)],
  currentPage: 0,
  premove: Array.from({length:25},()=>({loc:'',desc:'',imgs:[]})),
  postmove: Array.from({length:25},()=>({loc:'',desc:'',imgs:[]})),
  dupSource: null
};

function makePage(n) {
  return {
    pageNum: n,
    items: Array.from({length:ROWS},(_,i)=>({
      itemNo: i+1, check:false, carton:'', cp:false,
      contents:'', room:'', shipperCheck:false, images:[]
    })),
    signature: null, propagate: true
  };
}

function switchTab(t) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t));
  if(t==='inventory') renderInv();
  if(t==='tally') renderTally();
  if(t==='premove') renderCond('premove');
  if(t==='postmove') renderCond('postmove');
}

function updateSetup() {
  state.setup = {
    name: g('s-name').value, ref: g('s-ref').value,
    origin: g('s-origin').value, dest: g('s-dest').value,
    bol: g('s-bol').value, tape: g('s-tape').value, tColor: g('s-tcolor').value,
    dOrig: g('s-dorig').value, dOrigDate: g('s-dorig-date').value,
    dDest: g('s-ddest').value, dDestDate: g('s-ddest-date').value
  };
  renderInvTabs();
}

function g(id){ return document.getElementById(id); }
function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

/* ---------- Pages ---------- */
function addPage() {
  const prev = state.pages[state.pages.length-1];
  const p = makePage(state.pages.length+1);
  p.signature = prev.propagate ? prev.signature : null;
  p.propagate = true;
  state.pages.push(p);
  state.currentPage = state.pages.length-1;
  renderInv();
}
function switchPage(i){ state.currentPage=i; renderInv(); }
function removePage(i){
  if(state.pages.length<=1) return;
  state.pages.splice(i,1);
  state.pages.forEach((p,j)=>p.pageNum=j+1);
  if(state.currentPage>=state.pages.length) state.currentPage=state.pages.length-1;
  renderInv();
}

/* ---------- Inventory grid ---------- */
function updateItem(pi, ri, f, v){
  state.pages[pi].items[ri][f]=v;
  if(f==='carton') updateTally();
}

/* ---------- Duplicate / Fill-down ---------- */
let lpTimer=null, lpFired=false;
function rowPointerDown(e, pi, ri){
  if(e.button!==0) return;
  lpFired=false;
  lpTimer=setTimeout(()=>{ lpFired=true; startDup(pi,ri); }, 500);
}
function rowPointerUp(e, pi, ri){
  clearTimeout(lpTimer);
  if(lpFired){ e.preventDefault(); return; }
  if(state.dupSource){
    if(state.dupSource.pi===pi && state.dupSource.ri!==ri){
      applyDup(pi, state.dupSource.ri, ri);
    }
  }
}
function startDup(pi, ri){
  state.dupSource={pi,ri};
  toast('Tap another row to fill down');
  renderInv();
}
function cancelDup(){ state.dupSource=null; renderInv(); }
function applyDup(pi, src, tgt){
  const start=Math.min(src,tgt), end=Math.max(src,tgt);
  const srcIt=state.pages[pi].items[src];
  for(let i=start;i<=end;i++){
    if(i===src) continue;
    const it=state.pages[pi].items[i];
    it.carton=srcIt.carton; it.contents=srcIt.contents;
    it.room=srcIt.room; it.cp=srcIt.cp;
  }
  state.dupSource=null;
  renderInv(); toast('Filled down');
}

/* ---------- Photos ---------- */
function snapPhoto(pi, ri){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=e=>{
    Array.from(e.target.files).forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>{ state.pages[pi].items[ri].images.push(ev.target.result); renderInv(); };
      r.readAsDataURL(f);
    });
  };
  inp.click();
}
function delPhoto(pi, ri, ii){ state.pages[pi].items[ri].images.splice(ii,1); renderInv(); }
function showImg(src){ g('overlay-img').src=src; g('overlay').style.display='flex'; }

/* ---------- Signature ---------- */
function initSig(pi){
  const c=g('sig-'+pi); if(!c) return;
  const dpr=window.devicePixelRatio||1;
  const r=c.getBoundingClientRect();
  c.width=r.width*dpr; c.height=r.height*dpr;
  const ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth=1.5; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=getComputedStyle(document.body).color;

  let dr=false;
  const pos=e=>{ const rc=c.getBoundingClientRect(); const cx=e.touches?e.touches[0].clientX:e.clientX; const cy=e.touches?e.touches[0].clientY:e.clientY; return{x:cx-rc.left,y:cy-rc.top}; };
  const start=e=>{ dr=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
  const move=e=>{ if(!dr) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
  const end=()=>{ dr=false; ctx.beginPath(); state.pages[pi].signature=c.toDataURL(); propagateSig(pi); };

  c.addEventListener('mousedown',start);
  c.addEventListener('mousemove',move);
  c.addEventListener('mouseup',end);
  c.addEventListener('mouseleave',end);
  c.addEventListener('touchstart',start,{passive:false});
  c.addEventListener('touchmove',move,{passive:false});
  c.addEventListener('touchend',end);

  if(state.pages[pi].signature){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height);
    img.src=state.pages[pi].signature;
  }
}
function clearSig(pi){
  state.pages[pi].signature=null;
  const c=g('sig-'+pi); if(c) c.getContext('2d').clearRect(0,0,c.width,c.height);
  propagateSig(pi);
}
function propagateSig(from){
  const sig=state.pages[from].signature;
  const el=g('prop-'+from);
  const propagate=el?el.checked:true;
  if(!propagate||!sig) return;
  for(let i=from+1;i<state.pages.length;i++) if(state.pages[i].propagate) state.pages[i].signature=sig;
  renderInv();
}

/* ---------- Tally ---------- */
function updateTally(){}
function computeTally(){
  const tally={}; let total=0;
  state.pages.forEach(p=>{
    p.items.forEach(it=>{
      const c=String(it.carton).trim().toLowerCase();
      if(!c) return;
      if(c.includes('ctn')||c.includes('matt')||c.includes('carton')||c.includes('mattress')){
        const key=String(it.carton).trim()||'Unknown';
        tally[key]=(tally[key]||0)+1;
        total++;
      }
    });
  });
  return {tally,total};
}

function renderTally(){
  const {tally,total}=computeTally();
  const s=state.setup;
  let html=`
    <div class="sheet">
      <div style="padding:8px 10px;border-bottom:2px solid var(--text-hi);font-size:12px;font-weight:700;text-transform:uppercase;">
        Carton & Mattress Tally
      </div>
      <div class="sheet-top">
        <div><div class="lbl">Shipper</div><div style="font-size:14px;">${esc(s.name)||'—'}</div></div>
        <div><div class="lbl">Ref</div><div style="font-size:14px;">${esc(s.ref)||'—'}</div></div>
        <div><div class="lbl">BOL</div><div style="font-size:14px;">${esc(s.bol)||'—'}</div></div>
      </div>
    </div>
    <div class="tally-grid">
      <div class="th">Carton / Article Type</div>
      <div class="th">Count</div>
      <div class="th">Running Total</div>
  `;
  let running=0;
  const sorted=Object.entries(tally).sort((a,b)=>b[1]-a[1]);
  if(sorted.length===0){
    html+=`<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-sec);">No cartons or mattresses entered yet.</div>`;
  }
  sorted.forEach(([type,count])=>{
    running+=count;
    html+=`<div>${esc(type)}</div><div class="mono" style="text-align:center;">${count}</div><div class="mono" style="text-align:center;">${running}</div>`;
  });
  html+=`
    <div style="background:var(--surface);font-weight:700;">TOTAL</div>
    <div style="background:var(--surface);font-weight:700;" class="mono" style="text-align:center;">${total}</div>
    <div style="background:var(--surface);font-weight:700;" class="mono" style="text-align:center;">${total}</div>
    </div>
  `;
  g('tally-content').innerHTML=html;
}

/* ---------- Render Inventory ---------- */
function renderInvTabs(){
  const el=g('inv-tabs'); if(!el) return;
  el.innerHTML=state.pages.map((p,i)=>`
    <button class="page-tab ${i===state.currentPage?'active':''}" onclick="switchPage(${i})">
      Pg ${p.pageNum}/${state.pages.length}
      ${state.pages.length>1?`<span style="margin-left:4px;opacity:0.5;" onclick="event.stopPropagation();removePage(${i})">×</span>`:''}
    </button>
  `).join('');
}

function renderInv(){
  const container=g('inv-content');
  const page=state.pages[state.currentPage];
  const s=state.setup;
  renderInvTabs();

  let html=`
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:2px solid var(--text-hi);">
        <div style="font-size:11px;font-weight:700;">HOUSEHOLD GOODS DESCRIPTIVE INVENTORY</div>
        <div class="mono" style="font-size:11px;">Pg ${page.pageNum} / ${state.pages.length}</div>
      </div>
      <div class="sheet-top">
        <div><div class="lbl">Shipper's Name</div><div style="font-size:14px;">${esc(s.name)||'&nbsp;'}</div></div>
        <div><div class="lbl">Carrier's Ref No</div><div style="font-size:14px;">${esc(s.ref)||'&nbsp;'}</div></div>
        <div><div class="lbl">Bill of Lading No</div><div style="font-size:14px;">${esc(s.bol)||'&nbsp;'}</div></div>
      </div>
      <div class="sheet-mid">
        <div><div class="lbl">Origin City, State</div><div style="font-size:14px;">${esc(s.origin)||'&nbsp;'}</div></div>
        <div><div class="lbl">Destination City, State</div><div style="font-size:14px;">${esc(s.dest)||'&nbsp;'}</div></div>
        <div><div class="lbl">Tape Lot No</div><div style="font-size:14px;">${esc(s.tape)||'&nbsp;'}</div></div>
        <div><div class="lbl">Tape Color</div><div style="font-size:14px;">${esc(s.tColor)||'&nbsp;'}</div></div>
      </div>

      <table class="inv-table">
        <thead>
          <tr>
            <th style="width:36px;">Item<br>No</th>
            <th style="width:32px;">Chk</th>
            <th>Carton Size or Article</th>
            <th style="width:32px;">CP</th>
            <th>Contents or Condition</th>
            <th style="width:70px;">Room</th>
            <th style="width:36px;">Ship<br>Chk</th>
            <th style="width:48px;">Photo</th>
          </tr>
        </thead>
        <tbody>
  `;

  page.items.forEach((it, idx)=>{
    const isSrc=state.dupSource && state.dupSource.pi===state.currentPage && state.dupSource.ri===idx;
    const imgs=it.images.map((img,i)=>`
      <img src="${img}" class="thumb" onclick="showImg('${img}')" alt="">
      <button class="btn-ghost" style="padding:0;width:12px;" onclick="delPhoto(${state.currentPage},${idx},${i})">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    `).join('');

    html+=`
      <tr>
        <td class="row-num ${isSrc?'source':''}"
          onpointerdown="rowPointerDown(event,${state.currentPage},${idx})"
          onpointerup="rowPointerUp(event,${state.currentPage},${idx})">
          ${it.itemNo}
        </td>
        <td><input type="checkbox" ${it.check?'checked':''} onchange="updateItem(${state.currentPage},${idx},'check',this.checked)"></td>
        <td><input type="text" value="${esc(it.carton)}" oninput="updateItem(${state.currentPage},${idx},'carton',this.value)" placeholder="3.0 ctn"></td>
        <td><input type="checkbox" ${it.cp?'checked':''} onchange="updateItem(${state.currentPage},${idx},'cp',this.checked)"></td>
        <td><textarea rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';updateItem(${state.currentPage},${idx},'contents',this.value)" placeholder="Decor">${esc(it.contents)}</textarea></td>
        <td><input type="text" value="${esc(it.room)}" oninput="updateItem(${state.currentPage},${idx},'room',this.value)" placeholder="LR"></td>
        <td><input type="checkbox" ${it.shipperCheck?'checked':''} onchange="updateItem(${state.currentPage},${idx},'shipperCheck',this.checked)"></td>
        <td class="photo-cell">
          ${imgs}
          <button class="cam-btn" onclick="snapPhoto(${state.currentPage},${idx})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </td>
      </tr>
    `;
  });

  html+=`</tbody></table>`;

  if(state.dupSource){
    html+=`<div class="mt-2"><button class="btn btn-sm" onclick="cancelDup()">Cancel fill-down</button></div>`;
  }

  html+=`
    <div class="bottom-block">
      <div class="flex between items-center mb-1">
        <div class="small">Total cartons counted: <span id="carton-total" class="mono">0</span></div>
        <label class="small" style="display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" id="prop-${state.currentPage}" ${page.propagate?'checked':''} onchange="state.pages[${state.currentPage}].propagate=this.checked; propagateSig(${state.currentPage});">
          Push-through signature
        </label>
      </div>

      <div class="sig-row">
        <div class="sig-box">
          <div class="lbl">Driver / Owner — Origin</div>
          <canvas id="sig-${state.currentPage}" class="sig-canvas"></canvas>
          <div style="margin-top:4px;"><button class="btn btn-sm btn-ghost" onclick="clearSig(${state.currentPage})">Clear</button></div>
        </div>
        <div class="sig-box">
          <div class="lbl">Driver / Owner — Destination</div>
          <div style="height:80px;border:1px dashed var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--text-sec);font-size:12px;">
            Sign at destination
          </div>
        </div>
      </div>

      <div class="tape-row">
        <div><div class="lbl">Driver (Origin)</div><div>${esc(s.dOrig)||'—'}</div></div>
        <div><div class="lbl">Date</div><div>${esc(s.dOrigDate)||'—'}</div></div>
        <div><div class="lbl">Driver (Dest)</div><div>${esc(s.dDest)||'—'}</div></div>
        <div><div class="lbl">Date</div><div>${esc(s.dDestDate)||'—'}</div></div>
      </div>
    </div>
    </div>
  `;

  container.innerHTML=html;
  updateCartonTotal();
  requestAnimationFrame(()=>initSig(state.currentPage));
}

function updateCartonTotal(){
  let t=0;
  state.pages.forEach(p=>p.items.forEach(it=>{
    const m=String(it.carton).match(/^\\s*(\\d+(?:\\.\\d+)?)/);
    if(m) t+=parseFloat(m[1]);
  }));
  const el=g('carton-total'); if(el) el.textContent=t.toFixed(1).replace(/\\.0$/,'');
}

/* ---------- Condition ---------- */
function condPhoto(type, idx){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.capture='environment';
  inp.onchange=e=>{
    Array.from(e.target.files).forEach(f=>{
      const r=new FileReader();
      r.onload=ev=>{ state[type][idx].imgs.push(ev.target.result); renderCond(type); };
      r.readAsDataURL(f);
    });
  };
  inp.click();
}
function delCondPhoto(type, idx, i){ state[type][idx].imgs.splice(i,1); renderCond(type); }

function renderCond(type){
  const container=g(type+'-content');
  const s=state.setup;
  const list=state[type];
  const label=type==='premove'?'Pre-move Condition':'Post-move Condition';

  let html=`
    <div class="sheet" style="margin-bottom:10px;">
      <div style="padding:6px 10px;border-bottom:2px solid var(--text-hi);font-size:11px;font-weight:700;text-transform:uppercase;">${label}</div>
      <div class="sheet-top">
        <div><div class="lbl">Shipper</div><div style="font-size:14px;">${esc(s.name)||'—'}</div></div>
        <div><div class="lbl">Ref</div><div style="font-size:14px;">${esc(s.ref)||'—'}</div></div>
        <div><div class="lbl">Date</div><div style="font-size:14px;">${esc(type==='premove'?s.dOrigDate:s.dDestDate)||'—'}</div></div>
      </div>
    </div>
    <table class="cond-table">
      <thead>
        <tr>
          <th style="width:36px;">No</th>
          <th style="width:120px;">Location / Room</th>
          <th>Condition Description</th>
          <th style="width:48px;">Photo</th>
        </tr>
      </thead>
      <tbody>
  `;

  list.forEach((it, idx)=>{
    const imgs=it.imgs.map((img,i)=>`
      <img src="${img}" class="thumb" onclick="showImg('${img}')" alt="">
      <button class="btn-ghost" style="padding:0;width:12px;" onclick="delCondPhoto('${type}',${idx},${i})">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    `).join('');

    html+=`
      <tr>
        <td class="mono" style="text-align:center;color:var(--text-sec);font-size:11px;">${idx+1}</td>
        <td><input type="text" value="${esc(it.loc)}" oninput="state.${type}[${idx}].loc=this.value" placeholder="Living room"></td>
        <td><textarea rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';state.${type}[${idx}].desc=this.value" placeholder="Scuff mark...">${esc(it.desc)}</textarea></td>
        <td class="photo-cell">
          ${imgs}
          <button class="cam-btn" onclick="condPhoto('${type}',${idx})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </td>
      </tr>
    `;
  });

  html+=`</tbody></table>`;
  container.innerHTML=html;
}

function toast(msg){
  const t=g('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

window.addEventListener('resize',()=>{ if(state.pages[state.currentPage]) initSig(state.currentPage); });
</script>
</body>
</html>
