<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Household Goods Descriptive Inventory</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --surface-raised: #ffffff;
    --border: #d4d4d8;
    --border-light: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #52525b;
    --text-tertiary: #a1a1aa;
    --danger: #dc2626;
    --accent: #2563eb;
    --radius-sm: 4px;
    --radius-md: 6px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-raised: #27272a;
      --border: #52525b;
      --border-light: #3f3f46;
      --text-primary: #fafafa;
      --text-secondary: #d4d4d8;
      --text-tertiary: #71717a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  body { padding: 8px; font-size: 13px; line-height: 1.4; }

  .tabs {
    display: flex;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
    padding-top: 2px;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 8px 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 13px;
    border-bottom: 2px solid transparent;
    transition: all 100ms ease-out;
    font-family: inherit;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--text-primary);
  }
  .panel { display: none; padding-bottom: 40px; }
  .panel.active { display: block; }

  /* Paper-form header */
  .form-header {
    border: 2px solid var(--text-primary);
    margin-bottom: 10px;
    background: var(--bg);
  }
  .form-header-top {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 0;
    border-bottom: 2px solid var(--text-primary);
  }
  .form-header-top > div {
    padding: 6px 10px;
    border-right: 1px solid var(--border);
  }
  .form-header-top > div:last-child { border-right: none; }
  .form-header-mid {
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 0;
    border-bottom: 1px solid var(--border);
  }
  .form-header-mid > div {
    padding: 6px 10px;
    border-right: 1px solid var(--border);
  }
  .form-header-mid > div:last-child { border-right: none; }
  .form-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--text-secondary);
    margin-bottom: 2px;
    font-weight: 600;
  }
  .form-header input {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--text-primary);
    font-family: inherit;
    padding: 2px 0;
  }
  .form-header input:focus { outline: none; }

  /* Legend */
  .legend-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-bottom: 1px solid var(--border);
    font-size: 9px;
    color: var(--text-secondary);
  }
  .legend-row > div {
    padding: 4px 10px;
    border-right: 1px solid var(--border);
  }
  .legend-row > div:last-child { border-right: none; }

  /* Inventory grid - exact paper match */
  .inv-sheet {
    border: 2px solid var(--text-primary);
    background: var(--bg);
  }
  .inv-grid-header {
    display: grid;
    grid-template-columns: 36px 32px 1fr 32px 2.2fr 70px 36px 44px;
    gap: 0;
    border-bottom: 2px solid var(--text-primary);
    background: var(--surface);
  }
  .inv-grid-header > div {
    padding: 5px 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.2;
  }
  .inv-grid-header > div:last-child { border-right: none; }

  .inv-row {
    display: grid;
    grid-template-columns: 36px 32px 1fr 32px 2.2fr 70px 36px 44px;
    gap: 0;
    border-bottom: 1px solid var(--border-light);
    min-height: 34px;
  }
  .inv-row:last-child { border-bottom: none; }
  .inv-row > div {
    border-right: 1px solid var(--border-light);
    padding: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .inv-row > div:last-child { border-right: none; }
  .inv-row > div.wide { justify-content: flex-start; }

  .inv-row input[type="text"],
  .inv-row textarea {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text-primary);
    font-family: inherit;
    padding: 2px 4px;
    resize: none;
    line-height: 1.3;
  }
  .inv-row input:focus, .inv-row textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: rgba(37,99,235,0.04);
    z-index: 2;
  }
  .inv-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--text-primary);
    cursor: pointer;
  }
  .row-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-tertiary);
    user-select: none;
    cursor: pointer;
    position: relative;
  }
  .row-num.selected {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    font-weight: 700;
  }
  .row-num.target-hover {
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .row-num::after {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 100ms;
  }
  .row-num.selected::after { opacity: 1; }

  .photo-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    flex-wrap: wrap;
    padding: 2px;
  }
  .img-thumb {
    width: 22px;
    height: 22px;
    object-fit: cover;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .photo-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--border);
    border-radius: 2px;
    background: none;
    cursor: pointer;
    color: var(--text-tertiary);
    padding: 0;
  }

  /* Bottom signature area */
  .bottom-area {
    border: 2px solid var(--text-primary);
    border-top: none;
    padding: 10px;
  }
  .sig-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .sig-box {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px;
    background: var(--surface-raised);
  }
  .sig-box label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-secondary);
    font-weight: 600;
    display: block;
    margin-bottom: 4px;
  }
  .sig-canvas {
    width: 100%;
    height: 80px;
    display: block;
    cursor: crosshair;
    touch-action: none;
    background: var(--bg);
    border-radius: 2px;
  }
  .sig-actions {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .tape-info {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    font-size: 11px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  /* Page tabs */
  .page-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .page-tab {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    font-weight: 500;
  }
  .page-tab.active {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }

  /* Condition sheet */
  .cond-grid-header {
    display: grid;
    grid-template-columns: 36px 100px 1fr 44px;
    gap: 0;
    border-bottom: 2px solid var(--text-primary);
    background: var(--surface);
  }
  .cond-grid-header > div {
    padding: 5px 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .cond-row {
    display: grid;
    grid-template-columns: 36px 100px 1fr 44px;
    gap: 0;
    border-bottom: 1px solid var(--border-light);
    min-height: 34px;
  }
  .cond-row > div {
    border-right: 1px solid var(--border-light);
    padding: 2px 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cond-row > div:last-child { border-right: none; }
  .cond-row > div.wide { justify-content: flex-start; }

  /* Overlay */
  .img-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: zoom-out;
    padding: 16px;
  }
  .img-overlay img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    object-fit: contain;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-primary);
    font-family: inherit;
    font-weight: 500;
    touch-action: manipulation;
  }
  .btn-primary {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }
  .btn-ghost {
    background: transparent;
    border: none;
    padding: 4px;
    color: var(--text-secondary);
  }
  .btn-sm { padding: 4px 8px; font-size: 11px; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--text-primary);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: var(--radius-md);
    font-size: 12px;
    font-weight: 500;
    z-index: 50;
    opacity: 0;
    transition: opacity 200ms;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-1 { gap: 4px; }
  .mb-1 { margin-bottom: 4px; }
  .mb-2 { margin-bottom: 8px; }
  .text-sm { font-size: 11px; }
  .text-secondary { color: var(--text-secondary); }
  .font-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  @media (min-width: 640px) {
    body { padding: 16px; }
    .inv-grid-header, .inv-row { grid-template-columns: 44px 36px 1fr 36px 2.5fr 90px 36px 52px; }
    .cond-grid-header, .cond-row { grid-template-columns: 44px 140px 1fr 52px; }
  }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn active" data-tab="setup" onclick="switchTab('setup')">Setup</button>
  <button class="tab-btn" data-tab="inventory" onclick="switchTab('inventory')">Inventory</button>
  <button class="tab-btn" data-tab="premove" onclick="switchTab('premove')">Pre-move condition</button>
  <button class="tab-btn" data-tab="postmove" onclick="switchTab('postmove')">Post-move condition</button>
</div>

<div id="panel-setup" class="panel active">
  <div class="form-header">
    <div class="form-header-top">
      <div>
        <div class="form-label">Shipper's Name</div>
        <input id="s-name" placeholder="Kathleen Kerr" oninput="updateSetup()">
      </div>
      <div>
        <div class="form-label">Carrier's Reference No</div>
        <input id="s-ref" placeholder="485951" oninput="updateSetup()">
      </div>
      <div>
        <div class="form-label">Bill of Lading No</div>
        <input id="s-bol" oninput="updateSetup()">
      </div>
    </div>
    <div class="form-header-mid">
      <div>
        <div class="form-label">Origin City, State</div>
        <input id="s-origin" placeholder="Youngville, NC" oninput="updateSetup()">
      </div>
      <div>
        <div class="form-label">Destination City, State</div>
        <input id="s-dest" placeholder="Southington, CT" oninput="updateSetup()">
      </div>
      <div>
        <div class="form-label">Tape Lot No</div>
        <input id="s-tape" oninput="updateSetup()">
      </div>
      <div>
        <div class="form-label">Tape Color</div>
        <input id="s-tcolor" oninput="updateSetup()">
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;">
    <div class="field">
      <label style="font-size:11px;color:var(--text-secondary);font-weight:600;">Driver (Origin)</label>
      <input id="s-dorig" oninput="updateSetup()" style="padding:8px;border:1px solid var(--border);border-radius:4px;font-size:14px;">
    </div>
    <div class="field">
      <label style="font-size:11px;color:var(--text-secondary);font-weight:600;">Date (Origin)</label>
      <input type="date" id="s-dorig-date" oninput="updateSetup()" style="padding:8px;border:1px solid var(--border);border-radius:4px;font-size:14px;">
    </div>
    <div class="field">
      <label style="font-size:11px;color:var(--text-secondary);font-weight:600;">Driver (Destination)</label>
      <input id="s-ddest" oninput="updateSetup()" style="padding:8px;border:1px solid var(--border);border-radius:4px;font-size:14px;">
    </div>
    <div class="field">
      <label style="font-size:11px;color:var(--text-secondary);font-weight:600;">Date (Destination)</label>
      <input type="date" id="s-ddest-date" oninput="updateSetup()" style="padding:8px;border:1px solid var(--border);border-radius:4px;font-size:14px;">
    </div>
  </div>
</div>

<div id="panel-inventory" class="panel">
  <div class="flex items-center justify-between mb-2">
    <div class="page-tabs" id="page-tabs"></div>
    <button class="btn btn-sm" onclick="addPage()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add page
    </button>
  </div>
  <div id="inventory-content"></div>
</div>

<div id="panel-premove" class="panel">
  <div id="premove-content"></div>
</div>

<div id="panel-postmove" class="panel">
  <div id="postmove-content"></div>
</div>

<div id="img-overlay" class="img-overlay" onclick="this.style.display='none'">
  <img id="img-overlay-img" src="" alt="">
</div>
<div id="toast" class="toast"></div>

<script>
const ROWS_PER_PAGE = 30;

let state = {
  setup: {},
  pages: [makePage(1)],
  currentPage: 0,
  premove: Array.from({length: 20}, () => ({loc:'', desc:'', imgs:[]})),
  postmove: Array.from({length: 20}, () => ({loc:'', desc:'', imgs:[]})),
  dupSource: null
};

function makePage(num) {
  return {
    pageNum: num,
    items: Array.from({length: ROWS_PER_PAGE}, (_, i) => ({
      itemNo: i + 1,
      check: false,
      carton: '',
      cp: false,
      contents: '',
      room: '',
      shipperCheck: false,
      images: []
    })),
    signature: null,
    propagate: true
  };
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'inventory') renderInventory();
  if (tab === 'premove') renderCondition('premove');
  if (tab === 'postmove') renderCondition('postmove');
}

function updateSetup() {
  state.setup = {
    name: document.getElementById('s-name').value,
    ref: document.getElementById('s-ref').value,
    bol: document.getElementById('s-bol').value,
    origin: document.getElementById('s-origin').value,
    dest: document.getElementById('s-dest').value,
    tape: document.getElementById('s-tape').value,
    tColor: document.getElementById('s-tcolor').value,
    dOrig: document.getElementById('s-dorig').value,
    dOrigDate: document.getElementById('s-dorig-date').value,
    dDest: document.getElementById('s-ddest').value,
    dDestDate: document.getElementById('s-ddest-date').value
  };
  renderPageTabs();
}

function addPage() {
  const prev = state.pages[state.pages.length - 1];
  const p = makePage(state.pages.length + 1);
  p.signature = prev.propagate ? prev.signature : null;
  p.propagate = true;
  state.pages.push(p);
  state.currentPage = state.pages.length - 1;
  renderInventory();
}

function switchPage(idx) {
  state.currentPage = idx;
  renderInventory();
}

function removePage(idx) {
  if (state.pages.length <= 1) return;
  state.pages.splice(idx, 1);
  state.pages.forEach((p, i) => p.pageNum = i + 1);
  if (state.currentPage >= state.pages.length) state.currentPage = state.pages.length - 1;
  renderInventory();
}

function updateItem(pageIdx, rowIdx, field, value) {
  state.pages[pageIdx].items[rowIdx][field] = value;
  if (field === 'carton') updateCartonCount();
}

function updateCartonCount() {
  let total = 0;
  state.pages.forEach(p => {
    p.items.forEach(it => {
      const m = String(it.carton).match(/^\\s*(\\d+(?:\\.\\d+)?)/);
      if (m) total += parseFloat(m[1]);
    });
  });
  const el = document.getElementById('carton-count');
  if (el) el.textContent = total.toFixed(1).replace(/\\.0$/, '');
}

/* ---------- Duplicate / Fill-down ---------- */
function startDup(pageIdx, rowIdx) {
  state.dupSource = { pageIdx, rowIdx };
  showToast('Tap another row to fill down to it');
  renderInventory();
}

function cancelDup() {
  state.dupSource = null;
  renderInventory();
}

function applyDup(pageIdx, targetRowIdx) {
  if (!state.dupSource) return;
  const src = state.pages[state.dupSource.pageIdx].items[state.dupSource.rowIdx];
  const start = Math.min(state.dupSource.rowIdx, targetRowIdx);
  const end = Math.max(state.dupSource.rowIdx, targetRowIdx);
  for (let i = start; i <= end; i++) {
    if (i === state.dupSource.rowIdx) continue;
    const it = state.pages[pageIdx].items[i];
    it.carton = src.carton;
    it.contents = src.contents;
    it.room = src.room;
    it.cp = src.cp;
  }
  state.dupSource = null;
  renderInventory();
  showToast('Filled down');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- Photos ---------- */
function triggerImage(pageIdx, rowIdx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => {
    Array.from(e.target.files).forEach(file => {
      const r = new FileReader();
      r.onload = ev => {
        state.pages[pageIdx].items[rowIdx].images.push(ev.target.result);
        renderInventory();
      };
      r.readAsDataURL(file);
    });
  };
  input.click();
}

function removeImage(pageIdx, rowIdx, imgIdx) {
  state.pages[pageIdx].items[rowIdx].images.splice(imgIdx, 1);
  renderInventory();
}

function showImage(src) {
  document.getElementById('img-overlay-img').src = src;
  document.getElementById('img-overlay').style.display = 'flex';
}

/* ---------- Signature ---------- */
function initSig(pageIdx) {
  const canvas = document.getElementById('sig-' + pageIdx);
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(document.body).color;

  let drawing = false;
  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: cx - r.left, y: cy - r.top };
  }
  function start(e) { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
  function move(e) { if (!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
  function end() { drawing = false; ctx.beginPath(); state.pages[pageIdx].signature = canvas.toDataURL(); propagateSig(pageIdx); }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive: false});
  canvas.addEventListener('touchmove', move, {passive: false});
  canvas.addEventListener('touchend', end);

  if (state.pages[pageIdx].signature) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = state.pages[pageIdx].signature;
  }
}

function clearSig(pageIdx) {
  state.pages[pageIdx].signature = null;
  const c = document.getElementById('sig-' + pageIdx);
  if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  propagateSig(pageIdx);
}

function propagateSig(fromIdx) {
  const sig = state.pages[fromIdx].signature;
  const el = document.getElementById('prop-' + fromIdx);
  const propagate = el ? el.checked : true;
  if (!propagate || !sig) return;
  for (let i = fromIdx + 1; i < state.pages.length; i++) {
    if (state.pages[i].propagate) state.pages[i].signature = sig;
  }
  renderInventory();
}

/* ---------- Rendering ---------- */
function escapeHtml(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function renderPageTabs() {
  const el = document.getElementById('page-tabs');
  if (!el) return;
  el.innerHTML = state.pages.map((p, i) => `
    <button class="page-tab ${i === state.currentPage ? 'active' : ''}" onclick="switchPage(${i})">
      Pg ${p.pageNum}/${state.pages.length}
      ${state.pages.length > 1 ? `<span style="margin-left:4px;opacity:0.6;" onclick="event.stopPropagation();removePage(${i})">×</span>` : ''}
    </button>
  `).join('');
}

function renderInventory() {
  const container = document.getElementById('inventory-content');
  const page = state.pages[state.currentPage];
  const s = state.setup;
  renderPageTabs();

  let html = `
    <div class="form-header">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:2px solid var(--text-primary);">
        <div style="font-size:11px;font-weight:700;">NEW WORLD VAN LINES, INC. &nbsp;|&nbsp; HOUSEHOLD GOODS DESCRIPTIVE INVENTORY</div>
        <div style="font-size:11px;font-weight:700;">Pg <span class="font-mono">${page.pageNum}</span> / <span class="font-mono">${state.pages.length}</span></div>
      </div>
      <div class="form-header-top">
        <div><div class="form-label">Shipper's Name</div><div style="font-size:14px;">${escapeHtml(s.name) || '&nbsp;'}</div></div>
        <div><div class="form-label">Carrier's Reference No</div><div style="font-size:14px;">${escapeHtml(s.ref) || '&nbsp;'}</div></div>
        <div><div class="form-label">Bill of Lading No</div><div style="font-size:14px;">${escapeHtml(s.bol) || '&nbsp;'}</div></div>
      </div>
      <div class="form-header-mid">
        <div><div class="form-label">Origin City, State</div><div style="font-size:14px;">${escapeHtml(s.origin) || '&nbsp;'}</div></div>
        <div><div class="form-label">Destination City, State</div><div style="font-size:14px;">${escapeHtml(s.dest) || '&nbsp;'}</div></div>
        <div><div class="form-label">Tape Lot No</div><div style="font-size:14px;">${escapeHtml(s.tape) || '&nbsp;'}</div></div>
        <div><div class="form-label">Tape Color</div><div style="font-size:14px;">${escapeHtml(s.tColor) || '&nbsp;'}</div></div>
      </div>
    </div>

    <div class="flex items-center justify-between mb-1">
      <div class="text-sm text-secondary">Cartons: <span id="carton-count" class="font-mono">0</span></div>
      <label class="text-sm text-secondary" style="display:flex;align-items:center;gap:4px;cursor:pointer;">
        <input type="checkbox" id="prop-${state.currentPage}" ${page.propagate ? 'checked' : ''} onchange="state.pages[${state.currentPage}].propagate=this.checked; propagateSig(${state.currentPage});">
        Push-through signature
      </label>
    </div>

    <div class="inv-sheet">
      <div class="inv-grid-header">
        <div>Item<br>No</div>
        <div>Chk</div>
        <div>Carton Size<br>or Article</div>
        <div>CP</div>
        <div>Contents of Carton<br>or Condition of Article</div>
        <div>Room</div>
        <div>Ship<br>Chk</div>
        <div>Photo</div>
      </div>
  `;

  page.items.forEach((it, idx) => {
    const isSource = state.dupSource && state.dupSource.pageIdx === state.currentPage && state.dupSource.rowIdx === idx;
    const imgs = it.images.map((img, i) => `
      <img src="${img}" class="img-thumb" onclick="showImage('${img}')" alt="">
      <button class="btn-ghost" style="padding:0;width:14px;height:14px;" onclick="removeImage(${state.currentPage},${idx},${i})">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    `).join('');

    html += `
      <div class="inv-row">
        <div class="row-num ${isSource ? 'selected' : ''}"
          onpointerdown="handleRowPointerDown(event, ${state.currentPage}, ${idx})"
          onpointerup="handleRowPointerUp(event, ${state.currentPage}, ${idx})">
          ${it.itemNo}
        </div>
        <div><input type="checkbox" ${it.check ? 'checked' : ''} onchange="updateItem(${state.currentPage},${idx},'check',this.checked)"></div>
        <div class="wide"><input type="text" value="${escapeHtml(it.carton)}" oninput="updateItem(${state.currentPage},${idx},'carton',this.value)" placeholder="3.0 ctn"></div>
        <div><input type="checkbox" ${it.cp ? 'checked' : ''} onchange="updateItem(${state.currentPage},${idx},'cp',this.checked)"></div>
        <div class="wide"><textarea rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';updateItem(${state.currentPage},${idx},'contents',this.value)" placeholder="Decor, dishes...">${escapeHtml(it.contents)}</textarea></div>
        <div class="wide"><input type="text" value="${escapeHtml(it.room)}" oninput="updateItem(${state.currentPage},${idx},'room',this.value)" placeholder="LR"></div>
        <div><input type="checkbox" ${it.shipperCheck ? 'checked' : ''} onchange="updateItem(${state.currentPage},${idx},'shipperCheck',this.checked)"></div>
        <div class="photo-cell">
          ${imgs}
          <button class="photo-btn" onclick="triggerImage(${state.currentPage},${idx})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    `;
  });

  html += `</div>`;

  if (state.dupSource) {
    html += `<div class="mb-2 mt-2"><button class="btn btn-sm" onclick="cancelDup()">Cancel fill-down</button></div>`;
  }

  html += `
    <div class="bottom-area">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:6px;">Remarks / Exceptions</div>
      <textarea style="width:100%;min-height:50px;border:1px solid var(--border);border-radius:4px;padding:6px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text-primary);resize:vertical;" placeholder="Enter any remarks..."></textarea>

      <div class="sig-grid">
        <div class="sig-box">
          <label>Driver / Owner — Origin</label>
          <canvas id="sig-${state.currentPage}" class="sig-canvas"></canvas>
          <div class="sig-actions">
            <button class="btn btn-sm btn-ghost" onclick="clearSig(${state.currentPage})">Clear</button>
          </div>
        </div>
        <div class="sig-box">
          <label>Driver / Owner — Destination</label>
          <div style="height:80px;border:1px dashed var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:12px;">
            Signed at destination
          </div>
        </div>
      </div>

      <div class="tape-info">
        <div><span class="form-label">Driver (Origin)</span><div>${escapeHtml(s.dOrig) || '—'}</div></div>
        <div><span class="form-label">Date</span><div>${escapeHtml(s.dOrigDate) || '—'}</div></div>
        <div><span class="form-label">Driver (Dest)</span><div>${escapeHtml(s.dDest) || '—'}</div></div>
        <div><span class="form-label">Date</span><div>${escapeHtml(s.dDestDate) || '—'}</div></div>
      </div>
    </div>
  `;

  container.innerHTML = html;
  updateCartonCount();
  requestAnimationFrame(() => initSig(state.currentPage));
}

/* Pointer handling for long-press row duplicate */
let longPressTimer = null;
let longPressFired = false;

function handleRowPointerDown(e, pageIdx, rowIdx) {
  if (e.button !== 0) return;
  longPressFired = false;
  longPressTimer = setTimeout(() => {
    longPressFired = true;
    startDup(pageIdx, rowIdx);
  }, 500);
}

function handleRowPointerUp(e, pageIdx, rowIdx) {
  clearTimeout(longPressTimer);
  if (longPressFired) {
    e.preventDefault();
    return;
  }
  if (state.dupSource) {
    if (state.dupSource.pageIdx === pageIdx && state.dupSource.rowIdx !== rowIdx) {
      applyDup(pageIdx, rowIdx);
    }
  }
}

/* ---------- Condition sheets ---------- */
function triggerCondImage(type, idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = e => {
    Array.from(e.target.files).forEach(file => {
      const r = new FileReader();
      r.onload = ev => { state[type][idx].imgs.push(ev.target.result); renderCondition(type); };
      r.readAsDataURL(file);
    });
  };
  input.click();
}
function removeCondImage(type, idx, i) { state[type][idx].imgs.splice(i, 1); renderCondition(type); }

function renderCondition(type) {
  const container = document.getElementById(type + '-content');
  const s = state.setup;
  const list = state[type];

  let html = `
    <div class="form-header" style="margin-bottom:10px;">
      <div style="padding:6px 10px;border-bottom:2px solid var(--text-primary);font-size:11px;font-weight:700;text-transform:uppercase;">
        ${type === 'premove' ? 'Pre-move Condition Report' : 'Post-move Condition Report'}
      </div>
      <div class="form-header-top">
        <div><div class="form-label">Shipper's Name</div><div style="font-size:14px;">${escapeHtml(s.name) || '&nbsp;'}</div></div>
        <div><div class="form-label">Reference No</div><div style="font-size:14px;">${escapeHtml(s.ref) || '&nbsp;'}</div></div>
        <div><div class="form-label">Date</div><div style="font-size:14px;">${escapeHtml(type==='premove'?s.dOrigDate:s.dDestDate) || '&nbsp;'}</div></div>
      </div>
    </div>

    <div class="inv-sheet">
      <div class="cond-grid-header">
        <div>No</div>
        <div>Location / Room</div>
        <div>Condition Description</div>
        <div>Photos</div>
      </div>
  `;

  list.forEach((it, idx) => {
    const imgs = it.imgs.map((img, i) => `
      <img src="${img}" class="img-thumb" onclick="showImage('${img}')" alt="">
      <button class="btn-ghost" style="padding:0;width:14px;height:14px;" onclick="removeCondImage('${type}',${idx},${i})">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
    `).join('');

    html += `
      <div class="cond-row">
        <div class="font-mono" style="color:var(--text-tertiary);font-size:11px;">${idx+1}</div>
        <div class="wide"><input type="text" value="${escapeHtml(it.loc)}" oninput="state.${type}[${idx}].loc=this.value" placeholder="Living room"></div>
        <div class="wide"><textarea rows="1" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';state.${type}[${idx}].desc=this.value" placeholder="Scuff mark on baseboard...">${escapeHtml(it.desc)}</textarea></div>
        <div class="photo-cell">
          ${imgs}
          <button class="photo-btn" onclick="triggerCondImage('${type}',${idx})">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    `;
  });

  html += `</div>`;
  container.innerHTML = html;
}

window.addEventListener('resize', () => {
  if (state.pages[state.currentPage]) initSig(state.currentPage);
});
</script>
</body>
</html>
