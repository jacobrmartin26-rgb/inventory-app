<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Inventory & Damage Report</title>
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --surface-raised: #ffffff;
    --border: #e4e4e7;
    --text-primary: #18181b;
    --text-secondary: #71717a;
    --text-tertiary: #a1a1aa;
    --danger: #dc2626;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --surface-raised: #27272a;
      --border: #3f3f46;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text-primary);
    padding: 16px;
    line-height: 1.5;
  }
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
    padding-top: 4px;
  }
  .tab-btn {
    padding: 8px 16px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    transition: all 120ms ease-out;
    font-family: inherit;
  }
  .tab-btn.active {
    color: var(--text-primary);
    border-bottom-color: var(--text-primary);
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px 16px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .field input,
  .field select,
  .field textarea {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    color: var(--text-primary);
    font-size: 14px;
    font-family: inherit;
  }
  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--text-primary);
  }

  .page-tabs {
    display: flex;
    gap: 4px;
    align-items: center;
    flex-wrap: wrap;
  }
  .page-tab {
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-primary);
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
  }
  .page-tab.active {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }
  .page-tab:hover .row-actions { opacity: 1; }

  .header-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    padding: 10px;
    background: var(--surface);
    border-radius: var(--radius-md);
    line-height: 1.5;
  }

  .inv-grid {
    display: grid;
    grid-template-columns: 44px 36px 1fr 36px 2fr 80px 36px 90px 36px;
    gap: 1px;
    background: var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .inv-grid > div {
    background: var(--surface-raised);
    padding: 6px 8px;
    font-size: 13px;
    display: flex;
    align-items: center;
    min-height: 36px;
  }
  .inv-grid .th {
    background: var(--surface);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .inv-grid input[type="text"],
  .inv-grid input[type="number"],
  .inv-grid textarea {
    width: 100%;
    border: none;
    background: transparent;
    font-size: 13px;
    color: var(--text-primary);
    padding: 2px;
    font-family: inherit;
    resize: vertical;
  }
  .inv-grid input:focus,
  .inv-grid textarea:focus { outline: none; }
  .inv-grid input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--text-primary);
    cursor: pointer;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-primary);
    font-family: inherit;
    font-weight: 500;
    transition: background 120ms ease-out;
  }
  .btn:hover { background: var(--surface-raised); }
  .btn-primary {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }
  .btn-primary:hover {
    background: var(--text-secondary);
    border-color: var(--text-secondary);
  }
  .btn-ghost {
    background: transparent;
    border: none;
    padding: 4px;
    color: var(--text-secondary);
  }
  .btn-ghost:hover {
    color: var(--text-primary);
    background: var(--surface);
  }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: rgba(220, 38, 38, 0.1); }

  .sig-wrap {
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-raised);
    position: relative;
  }
  .sig-canvas {
    width: 100%;
    height: 100px;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  .img-thumb {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .img-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: zoom-out;
  }
  .img-overlay img {
    max-width: 90%;
    max-height: 90%;
    border-radius: var(--radius-md);
  }

  .damage-section { margin-bottom: 20px; }
  .damage-section h3 {
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 8px;
    color: var(--text-primary);
  }
  .damage-card {
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
    margin-bottom: 8px;
    background: var(--surface-raised);
  }

  .flex { display: flex; }
  .items-center { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-1 { gap: 4px; }
  .gap-2 { gap: 8px; }
  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .mb-2 { margin-bottom: 8px; }
  .text-sm { font-size: 12px; }
  .text-secondary { color: var(--text-secondary); }
  .font-mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .row-actions {
    opacity: 0;
    transition: opacity 120ms ease-out;
  }
  .inv-row:hover .row-actions,
  .inv-row:focus-within .row-actions,
  .damage-card:hover .row-actions { opacity: 1; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .header-summary { grid-template-columns: repeat(2, 1fr); }
    .inv-grid { grid-template-columns: 36px 30px 1fr 30px 1.5fr 60px 30px 70px 30px; }
  }
</style>
</head>
<body>

<div id="app">
  <div class="tabs">
    <button class="tab-btn active" data-tab="setup" onclick="switchTab('setup')">Setup</button>
    <button class="tab-btn" data-tab="inventory" onclick="switchTab('inventory')">Inventory</button>
    <button class="tab-btn" data-tab="damage" onclick="switchTab('damage')">Damage report</button>
  </div>

  <div id="panel-setup" class="panel active">
    <div class="form-grid">
      <div class="field"><label>Shipper name</label><input id="s-name" oninput="updateSetup()"></div>
      <div class="field"><label>Carrier reference no</label><input id="s-ref" oninput="updateSetup()"></div>
      <div class="field"><label>Origin city</label><input id="s-ocity" oninput="updateSetup()"></div>
      <div class="field"><label>Origin state</label><input id="s-ostate" oninput="updateSetup()"></div>
      <div class="field"><label>Destination city</label><input id="s-dcity" oninput="updateSetup()"></div>
      <div class="field"><label>Destination state</label><input id="s-dstate" oninput="updateSetup()"></div>
      <div class="field"><label>Bill of lading no</label><input id="s-bol" oninput="updateSetup()"></div>
      <div class="field"><label>Tape lot no</label><input id="s-tape" oninput="updateSetup()"></div>
      <div class="field"><label>Tape color</label><input id="s-tcolor" oninput="updateSetup()"></div>
      <div class="field"><label>Driver (origin)</label><input id="s-dorig" oninput="updateSetup()"></div>
      <div class="field"><label>Date (origin)</label><input type="date" id="s-dorig-date" oninput="updateSetup()"></div>
      <div class="field"><label>Driver (destination)</label><input id="s-ddest" oninput="updateSetup()"></div>
      <div class="field"><label>Date (destination)</label><input type="date" id="s-ddest-date" oninput="updateSetup()"></div>
    </div>
  </div>

  <div id="panel-inventory" class="panel">
    <div class="flex items-center justify-between mb-2">
      <div class="page-tabs" id="page-tabs"></div>
      <button class="btn" onclick="addInventoryPage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.0684 2.03418C12.5654 2.03421 12.9687 2.43755 12.9688 2.93457V11.0996H21.0654C21.5625 11.0996 21.9658 11.503 21.9658 12C21.9658 12.497 21.5625 12.9004 21.0654 12.9004H12.9688V21.0654C12.9687 21.5624 12.5654 21.9658 12.0684 21.9658C11.5713 21.9658 11.168 21.5625 11.168 21.0654V12.9004H2.93457C2.43751 12.9004 2.03418 12.4971 2.03418 12C2.03418 11.5029 2.43751 11.0996 2.93457 11.0996H11.168V2.93457C11.168 2.43751 11.5713 2.03418 12.0684 2.03418Z" fill="currentColor"/>
        </svg>
        Add page
      </button>
    </div>
    <div id="inventory-content"></div>
  </div>

  <div id="panel-damage" class="panel">
    <div id="damage-content"></div>
  </div>
</div>

<div id="img-overlay" class="img-overlay" onclick="this.style.display='none'">
  <img id="img-overlay-img" src="" alt="">
</div>

<script>
let state = {
  setup: {},
  inventory: [{ pageNum: 1, items: [], signature: null, propagate: true }],
  currentPage: 0,
  damage: { pre: [{loc:'',desc:'',imgs:[]}], post: [{loc:'',desc:'',imgs:[]}] }
};

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if (tab === 'inventory') renderInventory();
  if (tab === 'damage') renderDamage();
}

function updateSetup() {
  state.setup = {
    name: document.getElementById('s-name').value,
    ref: document.getElementById('s-ref').value,
    oCity: document.getElementById('s-ocity').value,
    oState: document.getElementById('s-ostate').value,
    dCity: document.getElementById('s-dcity').value,
    dState: document.getElementById('s-dstate').value,
    bol: document.getElementById('s-bol').value,
    tape: document.getElementById('s-tape').value,
    tColor: document.getElementById('s-tcolor').value,
    dOrig: document.getElementById('s-dorig').value,
    dOrigDate: document.getElementById('s-dorig-date').value,
    dDest: document.getElementById('s-ddest').value,
    dDestDate: document.getElementById('s-ddest-date').value
  };
}

function addInventoryPage() {
  const prev = state.inventory[state.inventory.length - 1];
  state.inventory.push({
    pageNum: state.inventory.length + 1,
    items: [],
    signature: prev.propagate ? prev.signature : null,
    propagate: true
  });
  state.currentPage = state.inventory.length - 1;
  renderInventory();
}

function switchPage(idx) {
  state.currentPage = idx;
  renderInventory();
}

function removePage(idx) {
  if (state.inventory.length <= 1) return;
  state.inventory.splice(idx, 1);
  state.inventory.forEach((p, i) => p.pageNum = i + 1);
  if (state.currentPage >= state.inventory.length) state.currentPage = state.inventory.length - 1;
  renderInventory();
}

function addItem(pageIdx) {
  const page = state.inventory[pageIdx];
  const itemNo = page.items.length > 0 ? page.items[page.items.length - 1].itemNo + 1 : 1;
  page.items.push({ itemNo, check: false, carton: '', cp: false, contents: '', room: '', shipperCheck: false, images: [] });
  renderInventory();
}

function removeItem(pageIdx, itemIdx) {
  state.inventory[pageIdx].items.splice(itemIdx, 1);
  renderInventory();
}

function updateItem(pageIdx, itemIdx, field, value) {
  state.inventory[pageIdx].items[itemIdx][field] = value;
  if (field === 'carton') updateCartonCount();
}

function updateCartonCount() {
  let total = 0;
  state.inventory.forEach(p => {
    p.items.forEach(it => {
      const match = String(it.carton).match(/^\s*(\d+(?:\.\d+)?)/);
      if (match) total += parseFloat(match[1]);
    });
  });
  const el = document.getElementById('carton-count');
  if (el) el.textContent = total;
}

function triggerImage(pageIdx, itemIdx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.multiple = true;
  input.onchange = e => {
    Array.from(e.target.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        state.inventory[pageIdx].items[itemIdx].images.push(ev.target.result);
        renderInventory();
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function removeImage(pageIdx, itemIdx, imgIdx) {
  state.inventory[pageIdx].items[itemIdx].images.splice(imgIdx, 1);
  renderInventory();
}

function showImage(src) {
  document.getElementById('img-overlay-img').src = src;
  document.getElementById('img-overlay').style.display = 'flex';
}

function initSignature(pageIdx) {
  const canvas = document.getElementById('sig-' + pageIdx);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = getComputedStyle(canvas).color || '#000';

  let drawing = false;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }

  function start(e) {
    drawing = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    e.preventDefault();
  }
  function move(e) {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    e.preventDefault();
  }
  function end() {
    drawing = false;
    ctx.beginPath();
    state.inventory[pageIdx].signature = canvas.toDataURL();
    propagateSignature(pageIdx);
  }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', end);
  canvas.addEventListener('mouseleave', end);
  canvas.addEventListener('touchstart', start, {passive: false});
  canvas.addEventListener('touchmove', move, {passive: false});
  canvas.addEventListener('touchend', end);

  if (state.inventory[pageIdx].signature) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0);
    img.src = state.inventory[pageIdx].signature;
  }
}

function clearSignature(pageIdx) {
  state.inventory[pageIdx].signature = null;
  const canvas = document.getElementById('sig-' + pageIdx);
  if (canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  propagateSignature(pageIdx);
}

function propagateSignature(fromIdx) {
  const sig = state.inventory[fromIdx].signature;
  const propagate = document.getElementById('prop-' + fromIdx)?.checked ?? true;
  if (!propagate || !sig) return;
  for (let i = fromIdx + 1; i < state.inventory.length; i++) {
    if (state.inventory[i].propagate) {
      state.inventory[i].signature = sig;
    }
  }
  renderInventory();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderInventory() {
  const container = document.getElementById('inventory-content');
  const page = state.inventory[state.currentPage];
  const tabsEl = document.getElementById('page-tabs');

  tabsEl.innerHTML = state.inventory.map((p, i) => `
    <button class="page-tab ${i === state.currentPage ? 'active' : ''}" onclick="switchPage(${i})">
      Page ${p.pageNum}
      ${state.inventory.length > 1 ? `
      <span class="row-actions" style="margin-left:4px;display:inline-flex;" onclick="event.stopPropagation(); removePage(${i})">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.9542 4.77253C18.3056 4.42106 18.8761 4.42106 19.2276 4.77253C19.579 5.12401 19.579 5.69452 19.2276 6.04597L13.2735 12.0001L19.2276 17.9542C19.5791 18.3056 19.5791 18.8761 19.2276 19.2276C18.8761 19.5791 18.3056 19.5791 17.9542 19.2276L12.0001 13.2735L6.04595 19.2276C5.69451 19.5791 5.12399 19.579 4.77252 19.2276C4.42104 18.8761 4.42104 18.3056 4.77252 17.9542L10.7266 12.0001L4.77252 6.04595C4.42104 5.69451 4.42104 5.12399 4.77252 4.77252C5.12399 4.42104 5.69451 4.42104 6.04595 4.77252L12.0001 10.7266L17.9542 4.77253Z" fill="currentColor"/>
        </svg>
      </span>` : ''}
    </button>
  `).join('');

  const s = state.setup;
  let html = `
    <div class="header-summary">
      <div><strong>${escapeHtml(s.name) || '—'}</strong><br>Shipper</div>
      <div>${escapeHtml(s.oCity) || ''}${s.oState ? ', ' + escapeHtml(s.oState) : ''} → ${escapeHtml(s.dCity) || ''}${s.d
