<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Household Goods Descriptive Inventory</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; padding: 0; }
      .page-break { page-break-after: always; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #000 !important; }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ITEMS_PER_PAGE = 25;

    function InventoryApp() {
      // Global Shared Header State
      const [header, setHeader] = useState({
        shipperName: '',
        origin: '',
        destination: '',
        carrierRef: '',
        billOfLading: '',
        tapeLotNo: '',
        tapeColor: '',
        tapeNosFrom: '',
        tapeNosThru: ''
      });

      // Signature States
      const [driverSig, setDriverSig] = useState(null);
      const [ownerSig, setOwnerSig] = useState(null);
      const [activeSigModal, setActiveSigModal] = useState(null);

      // Inventory Data
      const [items, setItems] = useState(() => {
        return Array.from({ length: 25 }, (_, i) => ({
          id: i + 1,
          article: '',
          cp: false,
          contents: '',
          room: ''
        }));
      });

      // Signature Pad Canvas References
      const sigCanvasRef = useRef(null);
      const sigPadInstance = useRef(null);

      useEffect(() => {
        if (activeSigModal && sigCanvasRef.current) {
          sigPadInstance.current = new SignaturePad(sigCanvasRef.current, {
            backgroundColor: 'rgb(255, 255, 255)'
          });
        }
      }, [activeSigModal]);

      // Dynamic Auto-Calculations
      const totalPages = Math.max(1, Math.ceil(items.length / ITEMS_PER_PAGE));
      const totalCartons = items.filter(item => item.article.trim() !== '' || item.cp).length;

      const handleHeaderChange = (e) => {
        const { name, value } = e.target;
        setHeader(prev => ({ ...prev, [name]: value }));
      };

      const handleItemChange = (index, field, value) => {
        setItems(prev => {
          const updated = [...prev];
          updated[index] = { ...updated[index], [field]: value };
          return updated;
        });
      };

      const addMoreRows = () => {
        setItems(prev => [
          ...prev,
          ...Array.from({ length: 10 }, (_, i) => ({
            id: prev.length + i + 1,
            article: '',
            cp: false,
            contents: '',
            room: ''
          }))
        ]);
      };

      const saveSignature = () => {
        if (sigPadInstance.current && !sigPadInstance.current.isEmpty()) {
          const dataUrl = sigPadInstance.current.toDataURL();
          if (activeSigModal === 'driver') setDriverSig(dataUrl);
          if (activeSigModal === 'owner') setOwnerSig(dataUrl);
          setActiveSigModal(null);
        }
      };

      const clearSignature = () => {
        if (sigPadInstance.current) sigPadInstance.current.clear();
      };

      return (
        <div class="max-w-5xl mx-auto p-4 md:p-6">
          {/* Action Toolbar */}
          <div class="no-print bg-white p-4 rounded-lg shadow mb-6 flex flex-wrap justify-between items-center gap-4">
            <div>
              <h1 class="text-xl font-bold text-gray-800">Digital Inventory System</h1>
              <p class="text-xs text-gray-500">Auto-counting cartons, auto-paging, and unified signature sync.</p>
            </div>
            <div class="flex gap-2">
              <button onClick={addMoreRows} class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700 font-medium">
                + Add 10 Rows
              </button>
              <button onClick={() => window.print()} class="bg-emerald-600 text-white px-4 py-2 rounded text-sm hover:bg-emerald-700 font-medium">
                Print / Save PDF
              </button>
            </div>
          </div>

          {/* Render Pages Dynamically */}
          {Array.from({ length: totalPages }).map((_, pageIdx) => {
            const pageItems = items.slice(pageIdx * ITEMS_PER_PAGE, (pageIdx + 1) * ITEMS_PER_PAGE);

            return (
              <div key={pageIdx} class="bg-white p-6 border border-gray-400 shadow-md mb-8 print-shadow-none page-break text-xs">
                {/* Header Section */}
                <div class="border-b-2 border-black pb-2 mb-2">
                  <div class="flex justify-between items-start">
                    <div>
                      <h2 class="font-bold text-sm">DESCRIPTIVE INVENTORY</h2>
                      <p class="text-[10px] text-gray-600">HOUSEHOLD GOODS</p>
                    </div>
                    <div class="flex gap-4 text-right">
                      <div class="border border-black px-2 py-1">
                        <span class="block font-bold">PAGE NO.</span>
                        <span>{pageIdx + 1}</span>
                      </div>
                      <div class="border border-black px-2 py-1">
                        <span class="block font-bold">NO. OF PAGES</span>
                        <span>{totalPages}</span>
                      </div>
                    </div>
                  </div>

                  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">
                    <div class="col-span-2">
                      <label class="block text-[9px] font-bold uppercase">Shipper's Name</label>
                      <input 
                        type="text" 
                        name="shipperName" 
                        value={header.shipperName} 
                        onChange={handleHeaderChange}
                        placeholder="Tap to type..."
                        class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 bg-transparent px-1 py-0.5"
                      />
                    </div>
                    <div>
                      <label class="block text-[9px] font-bold uppercase">Carrier Ref No.</label>
                      <input 
                        type="text" 
                        name="carrierRef" 
                        value={header.carrierRef} 
                        onChange={handleHeaderChange}
                        class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 bg-transparent px-1 py-0.5"
                      />
                    </div>
                    <div>
                      <label class="block text-[9px] font-bold uppercase">Bill of Lading No.</label>
                      <input 
                        type="text" 
                        name="billOfLading" 
                        value={header.billOfLading} 
                        onChange={handleHeaderChange}
                        class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 bg-transparent px-1 py-0.5"
                      />
                    </div>
                    <div class="col-span-2">
                      <label class="block text-[9px] font-bold uppercase">Origin City, State</label>
                      <input 
                        type="text" 
                        name="origin" 
                        value={header.origin} 
                        onChange={handleHeaderChange}
                        class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 bg-transparent px-1 py-0.5"
                      />
                    </div>
                    <div class="col-span-2">
                      <label class="block text-[9px] font-bold uppercase">Destination City, State</label>
                      <input 
                        type="text" 
                        name="destination" 
                        value={header.destination} 
                        onChange={handleHeaderChange}
                        class="w-full border-b border-gray-400 focus:outline-none focus:border-blue-500 bg-transparent px-1 py-0.5"
                      />
                    </div>
                  </div>
                </div>

                {/* Main Table */}
                <table class="w-full border-collapse border border-black mb-2 text-left">
                  <thead>
                    <tr class="bg-gray-100 border-b border-black text-center text-[10px]">
                      <th class="border border-black p-1 w-12">ITEM NO.</th>
                      <th class="border border-black p-1">CARTON SIZE OR ARTICLE</th>
                      <th class="border border-black p-1 w-10">CP</th>
                      <th class="border border-black p-1">CONTENTS OR CONDITION</th>
                      <th class="border border-black p-1">ROOM</th>
                    </tr>
                  </thead>
                  <tbody>
                    {pageItems.map((item, localIdx) => {
                      const globalIdx = pageIdx * ITEMS_PER_PAGE + localIdx;
                      return (
                        <tr key={item.id} class="border-b border-gray-300">
                          <td class="border border-black px-1 text-center font-bold">{globalIdx + 1}</td>
                          <td class="border border-black p-0">
                            <input 
                              type="text" 
                              value={item.article} 
                              onChange={(e) => handleItemChange(globalIdx, 'article', e.target.value)}
                              class="w-full h-full px-1 py-1 focus:bg-blue-50 focus:outline-none bg-transparent"
                            />
                          </td>
                          <td class="border border-black text-center p-0">
                            <input 
                              type="checkbox" 
                              checked={item.cp} 
                              onChange={(e) => handleItemChange(globalIdx, 'cp', e.target.checked)}
                              class="h-4 w-4 text-blue-600 rounded"
                            />
                          </td>
                          <td class="border border-black p-0">
                            <input 
                              type="text" 
                              value={item.contents} 
                              onChange={(e) => handleItemChange(globalIdx, 'contents', e.target.value)}
                              class="w-full h-full px-1 py-1 focus:bg-blue-50 focus:outline-none bg-transparent"
                            />
                          </td>
                          <td class="border border-black p-0">
                            <input 
                              type="text" 
                              value={item.room} 
                              onChange={(e) => handleItemChange(globalIdx, 'room', e.target.value)}
                              class="w-full h-full px-1 py-1 focus:bg-blue-50 focus:outline-none bg-transparent"
                            />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* Footer Section & Signatures */}
                <div class="border border-black p-2 mt-2">
                  <div class="flex justify-between items-center mb-2 font-bold text-[11px] bg-gray-50 p-1 border border-gray-300">
                    <span>TOTAL CARTONS COUNTED: {totalCartons}</span>
                    <span>TAPE LOT NO: <input type="text" name="tapeLotNo" value={header.tapeLotNo} onChange={handleHeaderChange} class="border-b border-black w-20 bg-transparent px-1" /></span>
                    <span>COLOR: <input type="text" name="tapeColor" value={header.tapeColor} onChange={handleHeaderChange} class="border-b border-black w-20 bg-transparent px-1" /></span>
                  </div>

                  <div class="grid grid-cols-2 gap-4 mt-2">
                    {/* Driver Signature Box */}
                    <div class="border border-black p-2 relative text-center min-h-[60px] flex flex-col justify-between">
                      <span class="text-[9px] font-bold block text-left">DRIVER SIGNATURE</span>
                      {driverSig ? (
                        <img src={driverSig} alt="Driver Signature" class="max-h-12 mx-auto object-contain" />
                      ) : (
                        <button 
                          onClick={() => setActiveSigModal('driver')} 
                          class="no-print bg-gray-200 hover:bg-gray-300 text-xs py-1 px-2 rounded mt-2"
                        >
                          Tap to Sign (Propagates Globally)
                        </button>
                      )}
                    </div>

                    {/* Owner Signature Box */}
                    <div class="border border-black p-2 relative text-center min-h-[60px] flex flex-col justify-between">
                      <span class="text-[9px] font-bold block text-left">OWNER / AUTHORIZED AGENT SIGNATURE</span>
                      {ownerSig ? (
                        <img src={ownerSig} alt="Owner Signature" class="max-h-12 mx-auto object-contain" />
                      ) : (
                        <button 
                          onClick={() => setActiveSigModal('owner')} 
                          class="no-print bg-gray-200 hover:bg-gray-300 text-xs py-1 px-2 rounded mt-2"
                        >
                          Tap to Sign (Propagates Globally)
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}

          {/* Signature Capture Modal */}
          {activeSigModal && (
            <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div class="bg-white rounded-lg p-4 max-w-md w-full shadow-xl">
                <h3 class="font-bold text-lg mb-2">
                  Draw {activeSigModal === 'driver' ? 'Driver' : 'Owner'} Signature
                </h3>
                <div class="border border-gray-400 rounded mb-4">
                  <canvas ref={sigCanvasRef} class="w-full h-40 touch-none"></canvas>
                </div>
                <div class="flex justify-between">
                  <button onClick={clearSignature} class="bg-gray-200 text-gray-800 px-3 py-1.5 rounded text-sm">
                    Clear
                  </button>
                  <div class="flex gap-2">
                    <button onClick={() => setActiveSigModal(null)} class="bg-gray-300 text-gray-800 px-3 py-1.5 rounded text-sm">
                      Cancel
                    </button>
                    <button onClick={saveSignature} class="bg-blue-600 text-white px-4 py-1.5 rounded text-sm font-medium">
                      Save & Apply
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InventoryApp />);
  </script>
</body>
</html>
